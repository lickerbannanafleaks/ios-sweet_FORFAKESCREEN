name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: [self-hosted, macOS, X64]
    env:
     HOMEBREW_NO_AUTO_UPDATE: "1"
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          sudo port install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          sudo mkdir -p /opt/local/bin
          printf '#!/bin/sh\nexit 0\n' | sudo tee /opt/local/bin/xcodes >/dev/null
          sudo chmod +x /opt/local/bin/xcodes
          echo "/opt/local/bin" >> "$GITHUB_PATH"
          export PATH="/opt/local/bin:$PATH"
          sw_vers
          ls -d /Applications/Xcode*.app
          XC="/Applications/Xcode.app"

          if [ ! -d "$XC" ]; then
           echo "ERROR: /Applications/Xcode.app not found"
           exit 1
          fi

          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          echo "jq: $(command -v jq)"
          jq --version
          bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)

          mkdir -p sdk-kernel-platform

          PLATFORM_HEADERS="$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform"

          if [ -d "$PLATFORM_HEADERS" ]; then
            cp -R "$PLATFORM_HEADERS" sdk-kernel-platform/
          else
            echo "PrivateHeaders/platform not available in this SDK."
            echo "Using available public Kernel.framework headers instead."

            HEADERS="$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/Headers"

            if [ -d "$HEADERS" ]; then
              cp -R "$HEADERS" sdk-kernel-platform/
            fi
          fi

          items=()

          for p in build/xnu.obj fakeroot/usr/local/include xnu; do
            if [ -e "dxb/$p" ]; then
              items+=("$p")
              echo "Including: $p"
            else
              echo "Not generated: $p"
            fi
          done

          tar czf buildtree.tgz \
            --exclude='*.o' \
            --exclude='*.cpo' \
            --exclude='*.a' \
            --exclude='*.dSYM' \
            --exclude='*.unstripped' \
            --exclude='kernel.development.*' \
            --exclude='.git' \
            -C dxb "${items[@]}" \
            -C .. sdk-kernel-platform

          ls -lh buildtree.tgz
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
